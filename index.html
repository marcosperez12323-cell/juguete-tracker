<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Juego navideño con control de cabeza</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f4eee3;
      font-family: Arial, sans-serif;
    }
    body { display: flex; justify-content: center; }
    #app { width: min(1100px, 100%); padding: 8px; }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .card {
      background: white;
      border: 2px solid #ddd;
      border-radius: 14px;
      padding: 8px 10px;
    }
    .card small { color: #666; display: block; }
    .card strong { display: block; font-size: 18px; }
    .game-wrap {
      position: relative;
      overflow: hidden;
      border: 2px solid #d7cec1;
      border-radius: 18px;
      background: #fffdf3;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      touch-action: none;
    }
    video {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: min(170px, 29%);
      border: 3px solid white;
      border-radius: 12px;
      background: #222;
      transform: scaleX(-1);
      box-shadow: 0 2px 10px rgba(0,0,0,.22);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    button {
      border: 0;
      border-radius: 14px;
      padding: 13px 7px;
      color: white;
      background: #d9485f;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.green { background: #3f8f5f; }
    button.dark { background: #515b66; }
    button:disabled { opacity: .55; }
    #cameraPanel {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(255,253,243,.93);
    }
    #cameraPanel > div {
      max-width: 520px;
      padding: 18px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 18px;
      text-align: center;
    }
    #cameraPanel h2 { margin: 0 0 8px; }
    #cameraMessage {
      min-height: 20px;
      margin: 8px 0 0;
      color: #555;
      font-size: 14px;
    }
    .meter {
      height: 12px;
      background: #e7e7e7;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    #meterFill {
      height: 100%;
      width: 50%;
      background: #3f8f5f;
      transition: width .05s linear;
    }
    .help {
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.45;
    }
    #diagnostic {
      margin-top: 7px;
      font-weight: 700;
      color: #39424c;
    }
    @media (max-width: 650px) {
      #app { padding: 4px; }
      .card { padding: 6px 8px; }
      .card strong { font-size: 15px; }
      button { padding: 11px 5px; font-size: 13px; }
      .help { font-size: 12px; }
    }
  </style>

  <!-- Script clásico: NO usa type="module" ni import() -->
  <script
    src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"
    crossorigin="anonymous">
  </script>
</head>

<body>
<main id="app">
  <section class="hud">
    <div class="card"><small>Puntaje</small><strong id="score">0</strong></div>
    <div class="card"><small>Cámara</small><strong id="cameraStatus">Apagada</strong></div>
    <div class="card"><small>Juego</small><strong id="gameStatus">Listo</strong></div>
  </section>

  <section class="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <video id="camera" autoplay playsinline muted></video>

    <div id="cameraPanel">
      <div>
        <h2>Control con la cabeza</h2>
        <p>Al tocar el botón, Safari debe pedir permiso para usar la cámara inmediatamente.</p>
        <button id="activateCamera" class="green">1. Activar cámara</button>
        <p id="cameraMessage"></p>
      </div>
    </div>
  </section>

  <section class="controls">
    <button id="left">← Izquierda</button>
    <button id="restart" class="green">Reiniciar</button>
    <button id="right">Derecha →</button>
  </section>

  <section class="controls">
    <button id="calibrate" class="dark">2. Centrar cabeza</button>
    <button id="toggleTracking" class="dark">Pausar detector</button>
    <button id="start" class="green">3. Empezar juego</button>
  </section>

  <section class="card help">
    <strong>Posición detectada</strong>
    <div class="meter"><div id="meterFill"></div></div>
    <div id="diagnostic">La página cargó correctamente.</div>
  </section>
</main>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var video = document.getElementById("camera");

  var scoreEl = document.getElementById("score");
  var cameraStatusEl = document.getElementById("cameraStatus");
  var gameStatusEl = document.getElementById("gameStatus");
  var cameraPanel = document.getElementById("cameraPanel");
  var cameraMessageEl = document.getElementById("cameraMessage");
  var diagnosticEl = document.getElementById("diagnostic");
  var meterFill = document.getElementById("meterFill");

  var W = canvas.width;
  var H = canvas.height;

  var cameraStream = null;
  var faceMesh = null;
  var trackingEnabled = false;
  var processingFrame = false;
  var detectorLoopStarted = false;
  var lastMirroredFaceX = 0.5;
  var smoothFaceX = 0.5;
  var calibratedCenter = 0.5;

  var state = {
    running: false,
    gameOver: false,
    score: 0,
    speed: 4,
    spawnCounter: 0,
    spawnEvery: 82,
    manualLeft: false,
    manualRight: false,
    player: { x: W / 2, y: H - 92, speed: 7 },
    obstacles: [],
    snow: Array.from({ length: 65 }, function () {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1 + Math.random() * 2,
        s: 0.4 + Math.random()
      };
    })
  };

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function resetGame() {
    state.running = false;
    state.gameOver = false;
    state.score = 0;
    state.speed = 4;
    state.spawnCounter = 0;
    state.spawnEvery = 82;
    state.player.x = W / 2;
    state.obstacles = [];
    scoreEl.textContent = "0";
    gameStatusEl.textContent = "Listo";
  }

  function startGame() {
    if (state.gameOver) resetGame();
    state.running = true;
    state.gameOver = false;
    gameStatusEl.textContent = "Jugando";
  }

  function spawnObstacle() {
    var lanes = [W * 0.38, W * 0.50, W * 0.62];
    state.obstacles.push({
      x: lanes[Math.floor(Math.random() * lanes.length)],
      y: -70
    });
  }

  function drawPaper() {
    ctx.fillStyle = "#fffdf2";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(92,151,210,.17)";
    ctx.lineWidth = 2;
    for (var y = 30; y < H; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    ctx.strokeStyle = "rgba(220,80,100,.20)";
    ctx.beginPath();
    ctx.moveTo(55, 0);
    ctx.lineTo(55, H);
    ctx.stroke();
  }

  function drawTree(x, y, scale) {
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(x - 6 * scale, y, 12 * scale, 25 * scale);

    ctx.fillStyle = "#3da55b";
    var layers = [
      [-70, 36, -15],
      [-50, 31, 2],
      [-30, 26, 13]
    ];

    for (var i = 0; i < layers.length; i++) {
      var layer = layers[i];
      ctx.beginPath();
      ctx.moveTo(x, y + layer[0] * scale);
      ctx.lineTo(x - layer[1] * scale, y + layer[2] * scale);
      ctx.lineTo(x + layer[1] * scale, y + layer[2] * scale);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = "#ffd43b";
    ctx.beginPath();
    ctx.arc(x, y - 74 * scale, 5 * scale, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    drawPaper();

    ctx.fillStyle = "#dff3ff";
    ctx.fillRect(0, H * 0.57, W, H * 0.43);

    drawTree(95, H - 90, 1.15);
    drawTree(175, H - 70, 0.85);
    drawTree(W - 95, H - 90, 1.15);
    drawTree(W - 175, H - 70, 0.85);

    for (var i = 0; i < state.snow.length; i++) {
      var flake = state.snow[i];
      ctx.fillStyle = "#abd9f5";
      ctx.beginPath();
      ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawRoad() {
    ctx.fillStyle = "#696d75";
    ctx.beginPath();
    ctx.moveTo(W * 0.42, 0);
    ctx.lineTo(W * 0.58, 0);
    ctx.lineTo(W * 0.76, H);
    ctx.lineTo(W * 0.24, H);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ffe070";
    ctx.lineWidth = 7;
    ctx.setLineDash([35, 28]);
    ctx.lineDashOffset = -(performance.now() / 12);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPlayer() {
    var p = state.player;

    ctx.fillStyle = "#d9485f";
    ctx.fillRect(p.x - 21, p.y - 10, 42, 48);

    ctx.fillStyle = "#ffd6b5";
    ctx.beginPath();
    ctx.arc(p.x, p.y - 30, 17, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#c62828";
    ctx.beginPath();
    ctx.moveTo(p.x - 20, p.y - 43);
    ctx.lineTo(p.x + 18, p.y - 43);
    ctx.lineTo(p.x + 8, p.y - 65);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(p.x + 9, p.y - 65, 6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnowman(obstacle) {
    var x = obstacle.x;
    var y = obstacle.y;

    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#b8c1c7";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.arc(x, y + 18, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y - 17, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#222";
    var dots = [[-7,-22],[7,-22],[0,5],[0,18],[0,31]];
    for (var i = 0; i < dots.length; i++) {
      ctx.beginPath();
      ctx.arc(x + dots[i][0], y + dots[i][1], 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "#f28c28";
    ctx.beginPath();
    ctx.moveTo(x, y - 14);
    ctx.lineTo(x + 15, y - 10);
    ctx.lineTo(x, y - 7);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#222";
    ctx.fillRect(x - 21, y - 44, 42, 7);
    ctx.fillRect(x - 13, y - 63, 26, 22);
  }

  function updateGame() {
    if (!state.running || state.gameOver) return;

    if (state.manualLeft) state.player.x -= state.player.speed;
    if (state.manualRight) state.player.x += state.player.speed;

    state.player.x = clamp(state.player.x, W * 0.28, W * 0.72);

    state.spawnCounter++;
    if (state.spawnCounter >= state.spawnEvery) {
      spawnObstacle();
      state.spawnCounter = 0;
    }

    for (var i = 0; i < state.obstacles.length; i++) {
      state.obstacles[i].y += state.speed;
    }

    for (var j = state.obstacles.length - 1; j >= 0; j--) {
      var obstacle = state.obstacles[j];

      if (obstacle.y > H + 80) {
        state.obstacles.splice(j, 1);
        state.score++;
        scoreEl.textContent = String(state.score);

        if (state.score % 5 === 0) {
          state.speed += 0.35;
          state.spawnEvery = Math.max(44, state.spawnEvery - 3);
        }
        continue;
      }

      var collision =
        state.player.x - 22 < obstacle.x + 30 &&
        state.player.x + 22 > obstacle.x - 30 &&
        state.player.y - 50 < obstacle.y + 48 &&
        state.player.y + 55 > obstacle.y - 62;

      if (collision) {
        state.gameOver = true;
        state.running = false;
        gameStatusEl.textContent = "¡Choque!";
      }
    }

    for (var k = 0; k < state.snow.length; k++) {
      var snowflake = state.snow[k];
      snowflake.y += snowflake.s;
      if (snowflake.y > H) {
        snowflake.y = -5;
        snowflake.x = Math.random() * W;
      }
    }
  }

  function drawGameOver() {
    if (!state.gameOver) return;

    ctx.fillStyle = "rgba(255,253,242,.84)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#d9485f";
    ctx.font = "bold 54px Arial";
    ctx.fillText("¡CHOQUE!", W / 2, H / 2 - 8);
    ctx.fillStyle = "#333";
    ctx.font = "25px Arial";
    ctx.fillText("Pulsa Reiniciar", W / 2, H / 2 + 38);
  }

  function onFaceResults(results) {
    if (
      !results ||
      !results.multiFaceLandmarks ||
      results.multiFaceLandmarks.length === 0
    ) {
      cameraStatusEl.textContent = "No veo rostro";
      return;
    }

    var landmarks = results.multiFaceLandmarks[0];
    var nose = landmarks[1];
    var mirroredX = 1 - nose.x;

    lastMirroredFaceX = mirroredX;
    smoothFaceX += (mirroredX - smoothFaceX) * 0.18;

    var offset = smoothFaceX - calibratedCenter;
    var normalized = clamp(0.5 + offset * 3.2, 0, 1);

    state.player.x = W * 0.28 + normalized * (W * 0.44);
    meterFill.style.width = (normalized * 100) + "%";
    cameraStatusEl.textContent = "Rostro detectado";
  }

  function initializeFaceDetector() {
    return new Promise(function (resolve, reject) {
      try {
        if (typeof window.FaceMesh === "undefined") {
          reject(new Error("El script clásico de MediaPipe no cargó."));
          return;
        }

        faceMesh = new window.FaceMesh({
          locateFile: function (file) {
            return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/" + file;
          }
        });

        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: false,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onFaceResults);
        resolve();
      } catch (error) {
        reject(error);
      }
    });
  }

  async function detectorLoop() {
    if (
      trackingEnabled &&
      faceMesh &&
      video.readyState >= 2 &&
      !processingFrame
    ) {
      processingFrame = true;
      try {
        await faceMesh.send({ image: video });
      } catch (error) {
        console.warn("Error procesando fotograma:", error);
      } finally {
        processingFrame = false;
      }
    }

    requestAnimationFrame(detectorLoop);
  }

  async function activateCamera() {
    var button = document.getElementById("activateCamera");
    button.disabled = true;

    try {
      if (!window.isSecureContext) {
        throw new Error("La página no está usando HTTPS.");
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("El navegador no permite usar la cámara.");
      }

      cameraStatusEl.textContent = "Pidiendo permiso";
      cameraMessageEl.textContent =
        "Safari debería mostrar el permiso de cámara ahora.";

      // Primero pedimos la cámara. No esperamos a MediaPipe.
      cameraStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        }
      });

      video.srcObject = cameraStream;
      await video.play();

      cameraPanel.style.display = "none";
      cameraStatusEl.textContent = "Encendida";
      diagnosticEl.textContent =
        "La cámara ya funciona. Cargando reconocimiento facial…";

      startGame();

      try {
        await initializeFaceDetector();
        trackingEnabled = true;
        cameraStatusEl.textContent = "Buscando rostro";
        diagnosticEl.textContent =
          "Detector listo. Mira al centro y pulsa “Centrar cabeza”.";

        if (!detectorLoopStarted) {
          detectorLoopStarted = true;
          requestAnimationFrame(detectorLoop);
        }
      } catch (detectorError) {
        console.error(detectorError);
        cameraStatusEl.textContent = "Solo cámara";
        diagnosticEl.textContent =
          "La cámara funciona, pero el detector no cargó: " +
          detectorError.message;
      }
    } catch (error) {
      console.error(error);
      cameraStatusEl.textContent = "Bloqueada";
      cameraMessageEl.textContent =
        "No se pudo abrir la cámara: " +
        (error.name ? error.name + " — " : "") +
        error.message;
      diagnosticEl.textContent =
        "Revisa el permiso de cámara de este sitio y vuelve a intentarlo.";
      button.disabled = false;
    }
  }

  function calibrateHead() {
    calibratedCenter = lastMirroredFaceX;
    smoothFaceX = calibratedCenter;
    meterFill.style.width = "50%";
    cameraStatusEl.textContent = faceMesh ? "Centrada" : "Sin detector";
    diagnosticEl.textContent = faceMesh
      ? "Listo. Mueve la cabeza suavemente hacia los lados."
      : "La cámara aún no tiene detector facial.";
  }

  function bindHoldButton(button, property) {
    button.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      state[property] = true;
    });

    ["pointerup", "pointercancel", "pointerleave"].forEach(function (name) {
      button.addEventListener(name, function () {
        state[property] = false;
      });
    });
  }

  bindHoldButton(document.getElementById("left"), "manualLeft");
  bindHoldButton(document.getElementById("right"), "manualRight");

  document.getElementById("restart").addEventListener("click", resetGame);
  document.getElementById("start").addEventListener("click", startGame);
  document.getElementById("calibrate").addEventListener("click", calibrateHead);
  document.getElementById("activateCamera").addEventListener("click", activateCamera);

  document.getElementById("toggleTracking").addEventListener("click", function (event) {
    trackingEnabled = !trackingEnabled;
    event.currentTarget.textContent =
      trackingEnabled ? "Pausar detector" : "Continuar detector";
    cameraStatusEl.textContent =
      trackingEnabled ? "Detector activo" : "Detector pausado";
  });

  function frame() {
    updateGame();
    drawBackground();
    drawRoad();

    for (var i = 0; i < state.obstacles.length; i++) {
      drawSnowman(state.obstacles[i]);
    }

    drawPlayer();
    drawGameOver();
    requestAnimationFrame(frame);
  }

  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Juego navideño con control de cabeza</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: #f4eee3; font-family: Arial, sans-serif; }
    body { display: flex; justify-content: center; }
    #app { width: min(1100px, 100%); padding: 8px; }
    .hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .card { background: white; border: 2px solid #ddd; border-radius: 14px; padding: 8px 10px; }
    .card small { color: #666; display: block; }
    .card strong { display: block; font-size: 18px; }
    .game-wrap { position: relative; overflow: hidden; border: 2px solid #d7cec1; border-radius: 18px; background: #fffdf3; }
    canvas { display: block; width: 100%; height: auto; touch-action: none; }
    video {
      position: absolute; right: 8px; bottom: 8px; width: min(160px, 27%);
      border: 3px solid white; border-radius: 12px; background: #222;
      transform: scaleX(-1); box-shadow: 0 2px 10px rgba(0,0,0,.22);
    }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    button {
      border: 0; border-radius: 14px; padding: 13px 7px; color: white;
      background: #d9485f; font-size: 15px; font-weight: 700; cursor: pointer;
      touch-action: manipulation;
    }
    button.green { background: #3f8f5f; }
    button.dark { background: #515b66; }
    button:disabled { opacity: .55; }
    #cameraPanel {
      position: absolute; inset: 0; z-index: 4; display: flex; align-items: center;
      justify-content: center; padding: 18px; background: rgba(255,253,243,.91);
    }
    #cameraPanel > div {
      max-width: 520px; padding: 18px; background: white; border: 2px solid #ddd;
      border-radius: 18px; text-align: center;
    }
    #cameraPanel h2 { margin: 0 0 8px; }
    #message { min-height: 20px; margin: 8px 0 0; color: #555; font-size: 14px; }
    .meter { height: 12px; background: #e7e7e7; border-radius: 999px; overflow: hidden; margin-top: 8px; }
    #meterFill { height: 100%; width: 50%; background: #3f8f5f; }
    .help { margin-top: 8px; font-size: 14px; line-height: 1.45; }
    @media (max-width: 650px) {
      #app { padding: 4px; }
      .card { padding: 6px 8px; }
      .card strong { font-size: 15px; }
      button { padding: 11px 5px; font-size: 13px; }
      .help { font-size: 12px; }
    }
  </style>
</head>
<body>
<main id="app">
  <section class="hud">
    <div class="card"><small>Puntaje</small><strong id="score">0</strong></div>
    <div class="card"><small>Cámara</small><strong id="cameraStatus">Apagada</strong></div>
    <div class="card"><small>Juego</small><strong id="gameStatus">Listo</strong></div>
  </section>

  <section class="game-wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <video id="camera" autoplay playsinline muted></video>

    <div id="cameraPanel">
      <div>
        <h2>Control con la cabeza</h2>
        <p>Primero prueba que los botones funcionen. Después activa la cámara y permite el acceso.</p>
        <button id="activateCamera" class="green">Activar cámara</button>
        <p id="message"></p>
      </div>
    </div>
  </section>

  <section class="controls">
    <button id="left">← Izquierda</button>
    <button id="restart" class="green">Reiniciar</button>
    <button id="right">Derecha →</button>
  </section>

  <section class="controls">
    <button id="calibrate" class="dark">Centrar cabeza</button>
    <button id="toggleCamera" class="dark">Pausar cámara</button>
    <button id="start" class="green">Empezar juego</button>
  </section>

  <section class="card help">
    Mueve la cabeza hacia los lados. La barra muestra la posición detectada.
    <div class="meter"><div id="meterFill"></div></div>
    <div id="debug">El juego ya está cargado. Prueba los botones rojos.</div>
  </section>
</main>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const video = document.getElementById("camera");

  const scoreEl = document.getElementById("score");
  const cameraStatusEl = document.getElementById("cameraStatus");
  const gameStatusEl = document.getElementById("gameStatus");
  const cameraPanel = document.getElementById("cameraPanel");
  const messageEl = document.getElementById("message");
  const debugEl = document.getElementById("debug");
  const meterFill = document.getElementById("meterFill");

  const W = canvas.width;
  const H = canvas.height;

  let faceLandmarker = null;
  let cameraStream = null;
  let trackingEnabled = false;
  let lastVideoTime = -1;
  let lastMirroredFaceX = 0.5;
  let smoothFaceX = 0.5;
  let calibratedCenter = 0.5;

  const state = {
    running: false,
    gameOver: false,
    score: 0,
    speed: 4,
    spawnCounter: 0,
    spawnEvery: 82,
    manualLeft: false,
    manualRight: false,
    player: { x: W / 2, y: H - 92, speed: 7 },
    obstacles: [],
    snow: Array.from({ length: 65 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1 + Math.random() * 2,
      s: 0.4 + Math.random()
    }))
  };

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function resetGame() {
    state.running = false;
    state.gameOver = false;
    state.score = 0;
    state.speed = 4;
    state.spawnCounter = 0;
    state.spawnEvery = 82;
    state.player.x = W / 2;
    state.obstacles = [];
    scoreEl.textContent = "0";
    gameStatusEl.textContent = "Listo";
  }

  function startGame() {
    if (state.gameOver) resetGame();
    state.running = true;
    state.gameOver = false;
    gameStatusEl.textContent = "Jugando";
  }

  function moveOneStep(direction) {
    state.player.x = clamp(state.player.x + direction * 55, W * 0.28, W * 0.72);
    debugEl.textContent = direction < 0 ? "Botón izquierdo funciona." : "Botón derecho funciona.";
  }

  function spawnObstacle() {
    const lanes = [W * 0.38, W * 0.50, W * 0.62];
    state.obstacles.push({
      x: lanes[Math.floor(Math.random() * lanes.length)],
      y: -70
    });
  }

  function drawPaper() {
    ctx.fillStyle = "#fffdf2";
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(92,151,210,.17)";
    ctx.lineWidth = 2;
    for (let y = 30; y < H; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    ctx.strokeStyle = "rgba(220,80,100,.20)";
    ctx.beginPath();
    ctx.moveTo(55, 0);
    ctx.lineTo(55, H);
    ctx.stroke();
  }

  function drawTree(x, y, scale) {
    ctx.fillStyle = "#8b5a2b";
    ctx.fillRect(x - 6 * scale, y, 12 * scale, 25 * scale);

    ctx.fillStyle = "#3da55b";
    const layers = [
      [-70, 36, -15],
      [-50, 31, 2],
      [-30, 26, 13]
    ];

    for (const [top, half, bottom] of layers) {
      ctx.beginPath();
      ctx.moveTo(x, y + top * scale);
      ctx.lineTo(x - half * scale, y + bottom * scale);
      ctx.lineTo(x + half * scale, y + bottom * scale);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = "#ffd43b";
    ctx.beginPath();
    ctx.arc(x, y - 74 * scale, 5 * scale, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    drawPaper();

    ctx.fillStyle = "#dff3ff";
    ctx.fillRect(0, H * 0.57, W, H * 0.43);

    drawTree(95, H - 90, 1.15);
    drawTree(175, H - 70, 0.85);
    drawTree(W - 95, H - 90, 1.15);
    drawTree(W - 175, H - 70, 0.85);

    for (const flake of state.snow) {
      ctx.fillStyle = "#abd9f5";
      ctx.beginPath();
      ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawRoad() {
    ctx.fillStyle = "#696d75";
    ctx.beginPath();
    ctx.moveTo(W * 0.42, 0);
    ctx.lineTo(W * 0.58, 0);
    ctx.lineTo(W * 0.76, H);
    ctx.lineTo(W * 0.24, H);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ffe070";
    ctx.lineWidth = 7;
    ctx.setLineDash([35, 28]);
    ctx.lineDashOffset = -(performance.now() / 12);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPlayer() {
    const p = state.player;

    ctx.fillStyle = "#d9485f";
    ctx.fillRect(p.x - 21, p.y - 10, 42, 48);

    ctx.fillStyle = "#ffd6b5";
    ctx.beginPath();
    ctx.arc(p.x, p.y - 30, 17, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#c62828";
    ctx.beginPath();
    ctx.moveTo(p.x - 20, p.y - 43);
    ctx.lineTo(p.x + 18, p.y - 43);
    ctx.lineTo(p.x + 8, p.y - 65);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(p.x + 9, p.y - 65, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.arc(p.x - 6, p.y - 33, 2, 0, Math.PI * 2);
    ctx.arc(p.x + 6, p.y - 33, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnowman(obstacle) {
    const x = obstacle.x;
    const y = obstacle.y;

    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#b8c1c7";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.arc(x, y + 18, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y - 17, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#222";
    for (const [dx, dy] of [[-7,-22],[7,-22],[0,5],[0,18],[0,31]]) {
      ctx.beginPath();
      ctx.arc(x + dx, y + dy, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "#f28c28";
    ctx.beginPath();
    ctx.moveTo(x, y - 14);
    ctx.lineTo(x + 15, y - 10);
    ctx.lineTo(x, y - 7);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#222";
    ctx.fillRect(x - 21, y - 44, 42, 7);
    ctx.fillRect(x - 13, y - 63, 26, 22);
  }

  function updateGame() {
    if (!state.running || state.gameOver) return;

    if (state.manualLeft) {
      state.player.x -= state.player.speed;
    }
    if (state.manualRight) {
      state.player.x += state.player.speed;
    }

    state.player.x = clamp(state.player.x, W * 0.28, W * 0.72);

    state.spawnCounter++;
    if (state.spawnCounter >= state.spawnEvery) {
      spawnObstacle();
      state.spawnCounter = 0;
    }

    for (const obstacle of state.obstacles) {
      obstacle.y += state.speed;
    }

    for (let i = state.obstacles.length - 1; i >= 0; i--) {
      const obstacle = state.obstacles[i];

      if (obstacle.y > H + 80) {
        state.obstacles.splice(i, 1);
        state.score++;
        scoreEl.textContent = String(state.score);

        if (state.score % 5 === 0) {
          state.speed += 0.35;
          state.spawnEvery = Math.max(44, state.spawnEvery - 3);
        }
        continue;
      }

      const collision =
        state.player.x - 22 < obstacle.x + 30 &&
        state.player.x + 22 > obstacle.x - 30 &&
        state.player.y - 50 < obstacle.y + 48 &&
        state.player.y + 55 > obstacle.y - 62;

      if (collision) {
        state.gameOver = true;
        state.running = false;
        gameStatusEl.textContent = "¡Choque!";
      }
    }

    for (const flake of state.snow) {
      flake.y += flake.s;
      if (flake.y > H) {
        flake.y = -5;
        flake.x = Math.random() * W;
      }
    }
  }

  function drawGameOver() {
    if (!state.gameOver) return;

    ctx.fillStyle = "rgba(255,253,242,.84)";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center";
    ctx.fillStyle = "#d9485f";
    ctx.font = "bold 54px Arial";
    ctx.fillText("¡CHOQUE!", W / 2, H / 2 - 8);
    ctx.fillStyle = "#333";
    ctx.font = "25px Arial";
    ctx.fillText("Pulsa Reiniciar", W / 2, H / 2 + 38);
  }

  async function loadMediaPipe() {
    const candidates = [
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs",
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
    ];

    let lastError = null;

    for (const url of candidates) {
      try {
        return await import(url);
      } catch (error) {
        lastError = error;
        console.warn("No cargó", url, error);
      }
    }

    throw lastError || new Error("No se pudo cargar MediaPipe.");
  }

  async function activateCamera() {
    const button = document.getElementById("activateCamera");
    button.disabled = true;
    messageEl.textContent = "Cargando reconocimiento facial…";
    cameraStatusEl.textContent = "Cargando";

    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Este navegador no permite usar la cámara.");
      }

      const visionModule = await loadMediaPipe();
      const { FaceLandmarker, FilesetResolver } = visionModule;

      const visionFiles = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm/"
      );

      const options = {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"
        },
        runningMode: "VIDEO",
        numFaces: 1,
        minFaceDetectionConfidence: 0.5,
        minFacePresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      };

      try {
        faceLandmarker = await FaceLandmarker.createFromOptions(visionFiles, {
          ...options,
          baseOptions: { ...options.baseOptions, delegate: "GPU" }
        });
      } catch (gpuError) {
        console.warn("GPU no disponible; usando CPU.", gpuError);
        faceLandmarker = await FaceLandmarker.createFromOptions(visionFiles, options);
      }

      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 640 },
          height: { ideal: 480 }
        },
        audio: false
      });

      video.srcObject = cameraStream;
      await video.play();

      trackingEnabled = true;
      cameraPanel.style.display = "none";
      cameraStatusEl.textContent = "Buscando rostro";
      debugEl.textContent = "Cámara activa. Mira al centro y pulsa “Centrar cabeza”.";

      startGame();
    } catch (error) {
      console.error(error);
      cameraStatusEl.textContent = "Error";
      messageEl.textContent =
        "No se pudo iniciar: " + (error && error.message ? error.message : "error desconocido") +
        ". Comprueba el permiso de cámara y recarga la página.";
      debugEl.textContent = "El juego manual sigue funcionando aunque la cámara falle.";
      button.disabled = false;
    }
  }

  function updateHeadTracking() {
    if (!trackingEnabled || !faceLandmarker || video.readyState < 2) return;
    if (video.currentTime === lastVideoTime) return;

    lastVideoTime = video.currentTime;

    try {
      const result = faceLandmarker.detectForVideo(video, performance.now());

      if (!result.faceLandmarks || result.faceLandmarks.length === 0) {
        cameraStatusEl.textContent = "No veo rostro";
        return;
      }

      const nose = result.faceLandmarks[0][1];
      const mirroredX = 1 - nose.x;

      lastMirroredFaceX = mirroredX;
      smoothFaceX += (mirroredX - smoothFaceX) * 0.18;

      const offset = smoothFaceX - calibratedCenter;
      const normalized = clamp(0.5 + offset * 3.2, 0, 1);

      state.player.x = W * 0.28 + normalized * (W * 0.44);
      meterFill.style.width = `${normalized * 100}%`;
      cameraStatusEl.textContent = "Rostro detectado";
    } catch (error) {
      console.warn("Error temporal de tracking:", error);
    }
  }

  function calibrateHead() {
    calibratedCenter = lastMirroredFaceX;
    smoothFaceX = calibratedCenter;
    meterFill.style.width = "50%";
    cameraStatusEl.textContent = "Centrada";
    debugEl.textContent = "Listo. Ahora mueve la cabeza hacia los lados.";
  }

  function bindHoldButton(button, property, direction) {
    button.addEventListener("click", () => moveOneStep(direction));

    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      state[property] = true;
      if (button.setPointerCapture) {
        try { button.setPointerCapture(event.pointerId); } catch (_) {}
      }
    });

    ["pointerup", "pointercancel", "lostpointercapture"].forEach(name => {
      button.addEventListener(name, () => {
        state[property] = false;
      });
    });
  }

  bindHoldButton(document.getElementById("left"), "manualLeft", -1);
  bindHoldButton(document.getElementById("right"), "manualRight", 1);

  document.getElementById("restart").addEventListener("click", resetGame);
  document.getElementById("start").addEventListener("click", startGame);
  document.getElementById("calibrate").addEventListener("click", calibrateHead);
  document.getElementById("activateCamera").addEventListener("click", activateCamera);

  document.getElementById("toggleCamera").addEventListener("click", event => {
    trackingEnabled = !trackingEnabled;
    event.currentTarget.textContent = trackingEnabled ? "Pausar cámara" : "Continuar cámara";
    cameraStatusEl.textContent = trackingEnabled ? "Activa" : "Pausada";
  });

  window.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") state.manualLeft = true;
    if (event.key === "ArrowRight") state.manualRight = true;
  });

  window.addEventListener("keyup", event => {
    if (event.key === "ArrowLeft") state.manualLeft = false;
    if (event.key === "ArrowRight") state.manualRight = false;
  });

  function frame() {
    updateHeadTracking();
    updateGame();

    drawBackground();
    drawRoad();
    for (const obstacle of state.obstacles) drawSnowman(obstacle);
    drawPlayer();
    drawGameOver();

    requestAnimationFrame(frame);
  }

  resetGame();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
